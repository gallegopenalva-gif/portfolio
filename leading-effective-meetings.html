<title>Leading Effective Meetings | Monica Gallego</title>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

}

overflow:hidden;
}

.hero::before{

width:300px;
height:300px;
background:rgba(255,255,255,0.08);
border-radius:50%;
top:-120px;
right:-100px;
}

.hero::after{
content:"";
position:absolute;
width:220px;
height:220px;
background:rgba(255,255,255,0.08);
border-radius:50%;
bottom:-80px;
left:-50px;
}

.hero-content{
position:relative;
z-index:2;
max-width:900px;
margin:auto;
}

.badge{
display:inline-block;
padding:10px 20px;
background:rgba(255,255,255,0.20);
border-radius:30px;
font-size:14px;
font-weight:bold;
margin-bottom:25px;
letter-spacing:1px;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:22px;
max-width:700px;
margin:auto;
}

.stats{
display:flex;
justify-content:center;
gap:30px;
margin-top:40px;
flex-wrap:wrap;
}

.stat{
background:rgba(255,255,255,0.15);
padding:18px 28px;
border-radius:15px;
}

.stat span{
display:block;
font-size:28px;
font-weight:bold;
}

.container{
width:85%;
max-width:1100px;
margin:auto;
padding:60px 0;
}

.card{
background:white;
padding:35px;
border-radius:18px;
margin-bottom:30px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.card h2{
margin-bottom:15px;
color:#0f172a;
}

.notice{
background:#eef4ff;
border-left:5px solid #2563eb;
padding:15px;
margin-top:20px;
border-radius:5px;
}

.start-btn{
display:inline-block;
margin-top:20px;
background:#2563eb;
color:white;
padding:12px 24px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.start-btn:hover{
background:#1d4ed8;
}

footer{
background:#0f172a;
color:white;
text-align:center;
padding:30px;
margin-top:40px;
}
